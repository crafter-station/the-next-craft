services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* se inlinean en build; Dokploy escribe estas vars al .env
      # del compose y docker-compose las sustituye aquí.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
    # Secretos de runtime (WhatsApp, Postgres, Sheet, Resend, CRON_SECRET).
    # Dokploy materializa estas vars en el .env del compose.
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
