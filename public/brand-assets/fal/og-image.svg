<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Next Craft ft. Fal</title>
  <desc id="desc">Title partner deck for The Next Craft hackathon with fal.ai</desc>
  <defs>
    <pattern id="scan" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 11.5H12" stroke="#8C8A82" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8C8A82" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#1A1A17"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
